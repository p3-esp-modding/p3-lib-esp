# ============================================================
# Mods del Patrician 3 - configuracion
# ============================================================

[fundacion]
# Que produce la ciudad que fundas como regidor:
#
#   modo=1  los 3 productos mas escasos de la Hansa (juego vainilla)
#   modo=2  igual, pero 4 productos en vez de 3
#   modo=3  TU eliges los productos (lista "productos" abajo)
#
# Productos disponibles para modo=3 (separados por comas):
#   grano, madera, cerveza, vino, miel, pescado, carne, cuero,
#   pieles, tela, sal, hierro, herramientas, lana, brea, canamo,
#   alfareria, ladrillos, aceite
#
# Nota: carne y cuero comparten fabrica; poner los dos cuenta como uno.
# ------------------------------------------------------------
modo=2
productos=grano,madera,cerveza,vino,miel


# Ciudad preferida para la mision de fundar ciudad, en orden.
#   ciudad=memel,windau,konigsberg
# Se usa la PRIMERA que no este fundada; si todas lo estan (o no pones
# nada), el juego ofrece la que calcula por defecto (nunca fuerza nada).
#
# Ciudades disponibles (separadas por coma en la clave "ciudad"):
#   edimburgo, newcastle, scarborough, boston, londres, brujas, haarlem,
#   harlingen, groninga, colonia, bremen, ribe, hamburgo, flensburgo, lubeck,
#   rostock, bergen, stavanger, tonsberg, oslo, aalborg, gotemburgo, naestved,
#   malmo, ahus, estocolmo, visby, helsinki, stettin, ruegenwald, gdansk,
#   torun, konigsberg, memel, windau, riga, pernau, reval, ladoga, novgorod
# ------------------------------------------------------------
# ciudad=boston,memel,windau,konigsberg,ruegenwald,pernau


# refresco de la mision de fundar:
#   auto      si cambias cualquier clave de [fundacion] con el juego abierto,
#             la mision se recalcula al instante (sin jugar meses).
#   defecto   el juego gestiona el ciclo de la mision como siempre.
# (Se lee al arrancar el juego.)
# ------------------------------------------------------------
refresco=defecto
