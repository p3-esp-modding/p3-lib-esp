# ============================================================
# Mods del Patrician 3 - configuracion
# ============================================================

[fundacion]
# Que produce la ciudad que fundas como regidor:
#
#   modo=1  los 3 productos mas escasos de la Hansa (juego vainilla)
#   modo=2  igual, pero 4 productos en vez de 3
#   modo=3  TU eliges los productos (lista "productos" abajo)
#
# Productos disponibles para modo=3 (separados por comas):
#   grano, madera, cerveza, vino, miel, pescado, carne, cuero,
#   pieles, tela, sal, hierro, herramientas, lana, brea, canamo,
#   alfareria, ladrillos, aceite
#
# Nota: carne y cuero comparten fabrica; poner los dos cuenta como uno.
# ------------------------------------------------------------
modo=2
productos=grano,madera,cerveza,vino,miel


[misiones]
# Este mod OBSERVA cuando el juego calcula las misiones del gobernador y lo
# escribe en misiones_log.txt (carpeta del juego). Cada linea guarda la fecha
# que el juego asigna a cada mision, su mascara de productos y su ciudad.
#
#   modo=loguear  (RECOMENDADO) solo registra, no cambia nada del juego.
#                 Jugando una sesion se ve si la fecha es la de OFERTA de la
#                 mision o el PLAZO para cumplirla al aceptarla.
#   modo=acortar  EXPERIMENTAL: ademas reescribe la fecha de la mision de
#                 fundar ciudad a "ahora + fundarCiudadMeses". NO activar
#                 hasta confirmar con el log que esa fecha es la de oferta
#                 (si fuera el plazo de cumplimiento, lo acortaria).
#
# fundarCiudadMeses: meses para modo=acortar (0..36; vanilla usa 25).
# ------------------------------------------------------------
modo=loguear
fundarCiudadMeses=3
