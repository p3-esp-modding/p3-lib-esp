name: Build p3-esp DLLs

on:
  push:
    branches: [pre-release, stable]
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [pre-release, stable]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: dll-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: dll-

      - name: Build
        shell: cmd
        run: cargo build --release --target i686-pc-windows-msvc

      - name: Assemble output
        shell: cmd
        run: |
          if exist output rmdir /s /q output
          mkdir output\mods
          copy /Y target\i686-pc-windows-msvc\release\p3_esp_modloader.dll output\
          copy /Y target\i686-pc-windows-msvc\release\p3_esp_dll_patcher.exe output\
          copy /Y target\i686-pc-windows-msvc\release\mod_catedral_crash.dll output\mods\
          copy /Y target\i686-pc-windows-msvc\release\mod_fundacion.dll output\mods\
          copy /Y target\i686-pc-windows-msvc\release\mod_fullhd.dll output\mods\
          copy /Y target\i686-pc-windows-msvc\release\mod_limite_ciudades.dll output\mods\
          copy /Y target\i686-pc-windows-msvc\release\mod_mendigos_taberna.dll output\mods\
          copy /Y target\i686-pc-windows-msvc\release\mod_refresco_misiones.dll output\mods\
          copy /Y target\i686-pc-windows-msvc\release\mod_satisfaccion_mendigos.dll output\mods\

      - name: Zip output
        shell: bash
        run: |
          cd output
          7z a -tzip ../p3-esp-dlls.zip '*' -xr'!*.pdb'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p3-esp-dlls
          path: output/

      - name: Compute dated tag
        if: github.event_name == 'push'
        id: tag
        shell: bash
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M)
          echo "value=${{ github.ref_name }}-${STAMP}" >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        if: github.event_name == 'push' && github.ref_name == 'pre-release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Pre-release ${{ steps.tag.outputs.value }}
          prerelease: true
          make_latest: false
          files: |
            p3-esp-dlls.zip
            p3_esp_mods.cfg

      - name: Create stable release
        if: github.event_name == 'push' && github.ref_name == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Stable ${{ steps.tag.outputs.value }}
          prerelease: false
          make_latest: true
          files: |
            p3-esp-dlls.zip
            p3_esp_mods.cfg

      - name: Prune old releases (keep 8 per branch)
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREFIX="${{ github.ref_name }}-"
          mapfile -t TAGS < <(gh release list --limit 100 --json tagName \
            --jq ".[] | select(.tagName | startswith(\"$PREFIX\")) | .tagName" | sort -r)
          i=0
          for t in "${TAGS[@]}"; do
            i=$((i+1))
            if [ "$i" -gt 8 ]; then
              gh release delete "$t" --cleanup-tag --yes
            fi
          done
